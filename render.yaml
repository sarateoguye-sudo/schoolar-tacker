services:
  - type: web
    name: scholar-tracker-demo
    runtime: python
    plan: free
    branch: fix/production-security
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: SCHOLAR_DB
        value: /tmp/scholar_tracker_demo.db
