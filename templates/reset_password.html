<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password | Scholar Tracker</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">ST</span><span>Scholar Tracker</span></a></header>
<main class="container"><section class="hero"><h1>Choose a new password</h1>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% endwith %}
<form method="post" class="auth-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" required minlength="12" autocomplete="new-password"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required minlength="12" autocomplete="new-password"><button class="primary-button" type="submit">Update password</button></form></section></main></body></html>
